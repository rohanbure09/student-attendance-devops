apiVersion: apps/v1
kind: Deployment
metadata:
  name: attendance-system-java
spec:
  replicas: 1
  selector:
    matchLabels:
      app: attendance-system-java
  template:
    metadata:
      labels:
        app: attendance-system-java
    spec:
      containers:
        - name: web
          image: attendance-system-java:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DATA_DIR
              value: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: attendance-system-java
spec:
  type: NodePort
  selector:
    app: attendance-system-java
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30081
